name: release

# Publishing runs here rather than on anyone's machine, so the artifact people download
# is built from the tagged commit by a job whose whole input is public. Nothing is
# uploaded from a developer's working tree, and no personal credential is involved: the
# job authenticates with the repository's own short-lived GITHUB_TOKEN.

# A published version is immutable. `v0.5.4` names one archive with one SHA-256, for as
# long as the release exists - because the plugin's bootstrap pins that digest and refuses
# anything else, and because a version whose bytes can change is not much of a version.
#
# This used to have a dispatch path that rebuilt an existing tag and re-uploaded over its
# assets with `--clobber`. It existed for a good reason - a tag's source had been corrected
# and the published archive had not followed - and it quietly broke the guarantee the
# digest pin depends on. A correction now needs a new version, which is the honest way to
# say "these are different bytes".
#
# Split by privilege. `test` and `build` run the repository's code - its tests, its build
# scripts - with a read-only token that is not left on disk. `publish` holds the rights to
# create a release and attest it, and runs none of the repository's code: it takes the
# archives `build` produced, checks them again, attests them and publishes them.
#
# `test` is the suite in parts, one job each (2026-09-28): the suite took about 80 minutes as one
# step of `build`, and `build` now starts only once every part has passed.
#
# Two editions, one version, one release (v0.6.11). The standard archive is the one every
# installed bootstrap updates to, under the name it has always had; the advanced archive is
# that same build plus the advanced package, under a name of its own. Both are built,
# audited and checked here, attested together, and published by the one release, so neither
# edition can go out without the other or under a different version.
#
# Each archive also goes out as a one-file installer, CodexAutoResume[-Advanced]-Setup-v<version>.exe,
# which carries that archive byte for byte and runs its Install.cmd (build/make_setup.py). make_release.py
# builds it from the archive it has just written; it is checked, audited, attested and published with the
# archives, and the archives, their names and every bootstrap that takes them are what they were.
#
# The split exists because the dispatch "dry run" was not one. Its build steps ran with
# the workflow-wide contents: write and id-token: write, checkout left the token in
# .git/config, and the three publish steps were gated only on github.ref being a tag - so
# a dispatch run against a tag could publish, and a dispatch against somebody's pull
# request ran their code holding a write token. Now a dispatch builds with nothing to
# steal, and only a real tag push reaches `publish`.
on:
  push:
    # A suffixed tag - v0.6.6-alpha, v0.6.6-beta - used to only ever rename a release that was
    # already published; its archive is attached and its version is the plain one, so a build
    # would refuse the tag and leave a red run. Nothing is built for any other suffix. The
    # exceptions are the pre-releases planned as ones (v0.6.9-alpha, v0.6.11-beta) and the later
    # ones of a stage, numbered from .2 (v0.6.11-beta.2): the manifest says the suffixed version,
    # so each is built, and published as a pre-release that never becomes the latest release. A
    # tag the two numbered patterns take and the version rule does not (v0.6.11-beta.1) is
    # refused by the build job's first check.
    tags: ["v*", "!v*-*", "v*.*.*-alpha", "v*.*.*-beta", "v*.*.*-alpha.*", "v*.*.*-beta.*"]
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch, tag or SHA to build and verify. Never publishes."
        required: false

# Nothing by default. Each job asks for exactly what it uses.
permissions: {}

# One release at a time, and never cancel one that is running. The step that refuses to
# republish a version reads the release's assets and then uploads; two runs of the same
# tag could both read "no assets yet" and both upload, which is exactly the mutability
# this release line exists to forbid. Serialising by tag closes that window.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    # Windows, where the product and its suite run.
    runs-on: windows-latest
    permissions:
      contents: read
    strategy:
      # Every part runs to the end, so one run shows every failure there is.
      fail-fast: false
      matrix:
        # PARTS below is the length of this list; tests/test_split_runs.py holds the two together,
        # so no part of the suite can be dropped by changing one of them.
        part: [1, 2, 3, 4]

    steps:
      # The same commit the build job builds, checked out the same way: no token left on disk, and
      # the tags and their commits here, because the upgrade and downgrade tests build their
      # databases with the store code of real tagged releases (the build job's checkout says more).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13.15"

      # A tag is not a reason to skip the tests; it is the last moment they still help.
      #
      # The release lane (scripts/test_parts.py LANES): the core suite as the standard edition, and
      # the advanced package's own tests with the package importable, as the advanced lane of
      # test.yml runs them. The standard archive is built from the first and the advanced archive is
      # the standard one plus the package, so these are the two suites the release rests on; that
      # lane has also run the whole core suite with the package on the path, and here that would be
      # the same run a second time. This job's part of them; the build waits for every part.
      - name: Run the automated test suite, this part
        shell: pwsh
        env:
          PART: ${{ matrix.part }}
          PARTS: "4"
        run: python scripts/test_parts.py --lane release --part "$env:PART/$env:PARTS" -v --annotate

  build:
    # Only once every part of the suite has passed.
    needs: test
    # The product is Windows-only, and the release contains two Windows executables
    # compiled with the in-box C# compiler, so it can only be built on Windows.
    runs-on: windows-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      # A dispatch builds and verifies whatever ref it names and publishes nothing, so
      # naming an existing tag re-checks that tag's source rather than replacing what it
      # released.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}
          # The token is for this checkout, not for whatever the checked-out code does next.
          persist-credentials: false
          # The upgrade and downgrade tests build their databases with the store code of
          # real tagged releases - `git show v0.5.7:src/.../store.py` - so the tags and
          # their commits have to be here. `test.yml` has said so since those tests were
          # written; this job ran the same suite and did not, because until v0.6.0 no tag
          # had ever reached it. The first real tag push failed here, on eight tests whose
          # own message is "CI must fetch the tags". The suite runs in `test` now, checked
          # out the same way, and this job still takes earlier releases' bootstraps out of the tags.
          #
          # It costs history, not privilege: the token is still not persisted, the job
          # still holds `contents: read`, and the repository is public.
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13.15"

      - name: Work out the version
        id: version
        shell: pwsh
        run: |
          $manifest = Get-Content .codex-plugin/plugin.json -Raw | ConvertFrom-Json
          $declared = [string]$manifest.version
          # The version names files and a release, and later steps read it. It is checked
          # here, once, so nothing downstream ever handles a value shaped like anything
          # but a version: ASCII digits, and nothing after the word and its number - \z, because
          # .NET's $ also matches before a final line break (tests/test_version_rule.py).
          if ($declared -cnotmatch '^[0-9]+\.[0-9]+\.[0-9]+(-(alpha|beta)(\.([2-9]|[1-9][0-9]{1,2}))?)?\z') {
            throw "plugin.json version '$declared' is not MAJOR.MINOR.PATCH, optionally -alpha or -beta, optionally .2 to .999"
          }
          if ($env:GITHUB_REF -like 'refs/tags/*') {
            $tagged = $env:GITHUB_REF -replace '^refs/tags/v', ''
            # A tag that disagrees with the manifest would publish an archive whose name,
            # plugin version and release title do not match. Stop instead.
            # -cne: -ne ignores case, and a tag that differs from the manifest only in case is
            # still not its version.
            if ($tagged -cne $declared) {
              throw "tag v$tagged does not match plugin.json version $declared"
            }
          }
          "version=$declared" >> $env:GITHUB_OUTPUT
          Write-Host "building v$declared"

      # Each edition has a settings window of its own - the advanced one is the standard sources
      # and the overlay's, in build/advanced/ - and the MCP launcher is one file for both.
      # make_gui.ps1 throws on any failure, so a first build that fails stops the step there.
      - name: Build each edition's settings window and the MCP launcher
        shell: pwsh
        run: |
          ./build/make_gui.ps1
          ./build/make_gui.ps1 -Edition advanced

      # Built a second time from the same source, and the digests compared. A release is
      # meant to be reproducible - anyone can rebuild the tag and get these bytes - and
      # this is where that stops being a claim: if the two builds on one machine differ,
      # nothing a reader rebuilds will match either, and the release does not go out.
      #
      # All three: the standard window and the launcher in build/, the advanced window in
      # build/advanced/. The two windows share a file name, so each is known by its folder too.
      - name: Check the executables are reproducible
        shell: pwsh
        run: |
          function Get-Built {
            @(Get-ChildItem build -Filter *.exe) + @(Get-ChildItem build/advanced -Filter *.exe)
          }
          $first = @{}
          foreach ($exe in Get-Built) {
            $first["$($exe.Directory.Name)/$($exe.Name)"] = (Get-FileHash $exe.FullName -Algorithm SHA256).Hash
          }
          if ($first.Count -ne 3) {
            throw "expected three executables, two in build/ and one in build/advanced/; found $($first.Count)"
          }
          Start-Sleep -Seconds 2
          ./build/make_gui.ps1 | Out-Null
          ./build/make_gui.ps1 -Edition advanced | Out-Null
          foreach ($exe in Get-Built) {
            $name = "$($exe.Directory.Name)/$($exe.Name)"
            $second = (Get-FileHash $exe.FullName -Algorithm SHA256).Hash
            if ($first[$name] -ne $second) {
              throw "$name differs between two builds of the same source"
            }
            Write-Host "$name reproducible: $($second.ToLower())"
          }

      # One step each: a step's result is its last command's, so a first build that failed
      # ahead of a second that did not would pass as one step.
      - name: Build the release archive
        run: python build/make_release.py --edition standard

      - name: Build the advanced edition's release archive
        run: python build/make_release.py --edition advanced

      # make_release.py compiled each edition's setup program around the archive it had just written.
      # Built a second time here from that archive and compared, as the executables above are, and held
      # to the archive beside it byte for byte and to its .sha256. One step each, for the reason above.
      - name: Check the setup program carries the archive and is reproducible
        run: python build/make_setup.py --check --edition standard

      - name: Check the advanced setup program carries its archive and is reproducible
        run: python build/make_setup.py --check --edition advanced

      - name: Extract the release notes
        env:
          VERSION: ${{ steps.version.outputs.version }}
        shell: pwsh
        run: python build/release_notes.py "$env:VERSION" --output build/dist/release-notes.md

      - name: Check each archive is what it claims to be
        env:
          VERSION: ${{ steps.version.outputs.version }}
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          # Each edition's archive under the name its template in scripts/release.json gives it,
          # which is the name a bootstrap of that edition asks for (tests/test_convergence.py
          # holds these to the templates).
          $archives = [ordered]@{
            standard = "build/dist/CodexAutoResume-v$($env:VERSION)-win-x64.zip"
            advanced = "build/dist/CodexAutoResume-Advanced-v$($env:VERSION)-win-x64.zip"
          }
          foreach ($edition in $archives.Keys) {
            $zip = $archives[$edition]
            if (-not (Test-Path $zip)) { throw "the build did not produce $zip" }
            # The checksum published beside the archive has to be the checksum OF the
            # archive; a stale one is worse than none, because people verify against it.
            $recorded = (Get-Content "$zip.sha256" -Raw).Split(' ')[0].Trim()
            $actual = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower()
            if ($recorded -ne $actual) { throw "checksum mismatch in ${zip}: recorded $recorded, actual $actual" }
            # An archive with no interpreter would install and then do nothing at all. The list is
            # what an installed bootstrap requires before it installs an archive (scripts/bootstrap.ps1
            # Test-Archive: $required and the payload root's files), and what every published
            # bootstrap required: an update is checked by the bootstrap already on the machine, so
            # an entry may be added here but never dropped. Both editions: the advanced archive is
            # checked by the same Test-Archive, asked for its edition.
            $names = [IO.Compression.ZipFile]::OpenRead((Resolve-Path $zip)).Entries.FullName
            foreach ($required in @('payload/runtime/python.exe',
                                    'payload/app/src/codex_auto_resume/mcpserver.py',
                                    'payload/app/mcp/codex-auto-resume-mcp.exe',
                                    'payload/app/.mcp.json',
                                    'payload/app/.codex-plugin/plugin.json',
                                    'payload/app/scripts/plugin_setup.py',
                                    'payload/CodexAutoResumeSettings.exe',
                                    'payload/codex-auto-resume.ico',
                                    'install/install.ps1',
                                    'Install.cmd')) {
              if ($names -notcontains $required) { throw "the $edition archive is missing $required" }
            }
            # And what makes the advanced one advanced: its package beside core, without which a
            # bootstrap asked for that edition refuses the archive.
            $package = 'payload/app/src/codex_auto_resume_advanced/__init__.py'
            if ($edition -eq 'advanced' -and $names -notcontains $package) {
              throw "the advanced archive is missing $package"
            }
            Write-Host "$edition archive verified: $actual"
          }

      # The standard archive is built from a list of trees that does not name advanced/, so it
      # cannot hold the advanced code; this is the proof that does not take the build script's
      # word for it. Eight findings, (a) to (h) in the script, read from the two archives' and the
      # two setup programs' bytes - (e) builds the standard archive again from `git archive HEAD`
      # with advanced/ deleted and wants the same file, and (h) the standard setup program around
      # it. It runs before anything is kept, so a file it refuses never reaches the publish job.
      - name: Prove the standard archive holds none of the advanced edition
        run: python build/edition_audit.py

      # An installed copy updates with the bootstrap it was installed with, never with this one:
      # that copy names the archive from its own release.json and checks what arrives with its
      # own Test-Archive. Each published bootstrap from v0.5.2 on is taken out of git - the tags
      # are here, fetch-depth: 0 above - and run on the standard archive just built, and one that
      # knows the advanced edition on the advanced archive too. One that would not take it is a
      # release installed copies silently stop updating to, so it stops here.
      - name: Check every published bootstrap takes the archive
        run: python build/legacy_bootstraps.py

      - name: Keep the archives even when nothing is published
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-build
          path: |
            build/dist/*.zip
            build/dist/*.exe
            build/dist/*.sha256
            build/dist/release-notes.md
          if-no-files-found: error

      - name: Say what a dry run did and did not do
        if: github.event_name == 'workflow_dispatch'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        shell: pwsh
        run: |
          Write-Host "Built and verified v$($env:VERSION), both editions."
          Write-Host "Nothing was published: a dispatch never reaches the publish job."
          Write-Host "The archives and setup programs are attached to this run as a workflow artifact."

  publish:
    needs: build
    # A tag push, and only a tag push. A dispatch whose ref happens to be a tag satisfies
    # startsWith(github.ref, 'refs/tags/v') too, which is how the old single job could
    # publish from a "dry run".
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      # To create the release.
      contents: write
      # For build provenance: `attestations: write` records it and `id-token: write` is
      # how the runner proves to the attestation service who it is.
      id-token: write
      attestations: write
    env:
      VERSION: ${{ needs.build.outputs.version }}
      GH_REPO: ${{ github.repository }}
      # Each edition's archive, named as the build job named it. Values, not code: every step
      # reads them as variables, and the first step below refuses a version of any other shape.
      STANDARD_ZIP: dist/CodexAutoResume-v${{ needs.build.outputs.version }}-win-x64.zip
      ADVANCED_ZIP: dist/CodexAutoResume-Advanced-v${{ needs.build.outputs.version }}-win-x64.zip
      # And each edition's setup program, which the build job held to its archive byte for byte.
      STANDARD_SETUP: dist/CodexAutoResume-Setup-v${{ needs.build.outputs.version }}.exe
      ADVANCED_SETUP: dist/CodexAutoResume-Advanced-Setup-v${{ needs.build.outputs.version }}.exe

    steps:
      # No checkout. Nothing in this job runs the repository's code.
      - name: Take the archives the build job verified
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-build
          path: dist

      - name: Check it again, here
        shell: bash
        run: |
          set -euo pipefail
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-(alpha|beta)(\.([2-9]|[1-9][0-9]{1,2}))?)?$ ]] || { echo "bad version '$VERSION'"; exit 1; }
          [[ "$GITHUB_REF" == "refs/tags/v$VERSION" ]] || { echo "tag $GITHUB_REF does not match v$VERSION"; exit 1; }
          for file in "$STANDARD_ZIP" "$ADVANCED_ZIP" "$STANDARD_SETUP" "$ADVANCED_SETUP"; do
            recorded="$(cut -d' ' -f1 "$file.sha256")"
            actual="$(sha256sum "$file" | cut -d' ' -f1)"
            [[ "$recorded" == "$actual" ]] || { echo "checksum mismatch in $file: recorded $recorded, actual $actual"; exit 1; }
            echo "$file verified: $actual"
          done

      # Which edition each archive is, read from its listing by `unzip`, because this job runs
      # nothing of the repository's - not even the audit the build job ran. The rule is the one
      # every bootstrap applies before it installs an archive (Test-Archive): the standard
      # archive holds nothing under the advanced package or skill, whatever the case or the
      # separator, and the advanced one holds the package. Two archives swapped or mixed would
      # publish the advanced code under the name every installed copy updates to. Each name is
      # read as the extraction writes it, with no '.' or empty segment and no '.' or ' ' at the
      # end of a segment, which Windows drops: 'src/./x', 'src//x' and 'src/x./y' all land in
      # src/x, and the raw name hid them from the grep.
      - name: Check each archive is its own edition
        shell: bash
        run: |
          set -euo pipefail
          written='s#[. ]+(/|$)#\1#g; s#/+#/#g; s#^/##'
          standard="$(unzip -Z1 "$STANDARD_ZIP" | tr '\\' '/' | sed -E "$written")"
          advanced="$(unzip -Z1 "$ADVANCED_ZIP" | tr '\\' '/' | sed -E "$written")"
          # A listing of nothing holds nothing of the advanced edition, and proves nothing.
          for listing in "$standard" "$advanced"; do
            grep -qx 'payload/runtime/python.exe' <<<"$listing" \
              || { echo "::error::An archive lists no payload/runtime/python.exe"; exit 1; }
          done
          held="$(grep -iE '^payload/app/(src/codex_auto_resume_advanced|skills/codex-auto-resume-advanced)/' <<<"$standard" || true)"
          if [[ -n "$held" ]]; then
            echo "::error::The standard archive holds the advanced edition:"
            echo "$held"
            exit 1
          fi
          grep -qx 'payload/app/src/codex_auto_resume_advanced/__init__.py' <<<"$advanced" \
            || { echo "::error::The advanced archive has no payload/app/src/codex_auto_resume_advanced/__init__.py"; exit 1; }
          echo "standard: $(wc -l <<<"$standard") entries, none of the advanced edition"
          echo "advanced: $(wc -l <<<"$advanced") entries, the advanced package among them"

      # The immutability gate. Publishing is refused outright if this version already
      # has assets, rather than replacing them - so the archive a `v0.5.4` download
      # returns today is the archive it returned the day it was published.
      - name: Refuse to republish a version that already has assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -uo pipefail
          if ! existing="$(gh release view "v$VERSION" --json assets 2>/dev/null)"; then
            echo "no release for v$VERSION yet; publishing is allowed"
            exit 0
          fi
          count="$(jq '.assets | length' <<<"$existing")"
          if [[ "$count" -gt 0 ]]; then
            echo "::error::Release v$VERSION already has published assets:"
            jq -r '.assets[].name | "::error::  " + .' <<<"$existing"
            echo "A published version is immutable. Bump the version and tag again instead of replacing v$VERSION."
            exit 1
          fi
          echo "release v$VERSION exists but carries no assets; publishing is allowed"

      # Build provenance, so a downloaded archive can be traced back to the workflow run
      # and the commit that produced it. Runs before publication: an archive that cannot
      # be attested should not become a release.
      #
      # One attestation, naming both archives and both setup programs as its subjects: they come
      # from one run of one commit, and `gh attestation verify` on any of them finds it. One step,
      # so no file can be published unattested by a step that was skipped or left out.
      - name: Attest the archives
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            ${{ env.STANDARD_ZIP }}
            ${{ env.ADVANCED_ZIP }}
            ${{ env.STANDARD_SETUP }}
            ${{ env.ADVANCED_SETUP }}

      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          # A pre-release is published as one and never becomes the latest release: every
          # installation's update check reads releases/latest, and none may be offered it.
          prerelease=()
          if [[ "$VERSION" == *-* ]]; then prerelease=(--prerelease --latest=false); fi
          # Eight assets: each edition's archive and setup program, and the checksum beside each.
          # The pre-release flags above are the release's, so they apply to every file alike.
          gh release create "v$VERSION" \
            "$STANDARD_ZIP" "$STANDARD_ZIP.sha256" \
            "$ADVANCED_ZIP" "$ADVANCED_ZIP.sha256" \
            "$STANDARD_SETUP" "$STANDARD_SETUP.sha256" \
            "$ADVANCED_SETUP" "$ADVANCED_SETUP.sha256" \
            --title "v$VERSION" \
            --notes-file dist/release-notes.md "${prerelease[@]}"
