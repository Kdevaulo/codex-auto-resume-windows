name: tests

on:
  push:
    # `dev` is where the work happens and where red is expected; main stays green.
    branches: [main, dev, refactor]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Supersede an in-flight run for the same ref: the newer commit is the one worth knowing
# about, and the ko sync keys off whichever run reports success, so leaving a stale run
# to finish would publish a branch nobody is waiting on.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # This tool targets Windows only, so CI runs on Windows only.
    runs-on: windows-latest
    # `scripts/python_support.json` is where these are decided, and
    # `tests/test_python_support.py` fails if this list and that file stop agreeing.
    # A matrix cannot read a file, so the list is repeated here and the test is what
    # keeps the repetition honest.
    #
    # Each Python is run once for each edition (v0.6.11). The standard lane is the suite as it
    # always was, and it fails if the advanced package can be imported at all; the advanced lane
    # is the same suite with the package importable, and the package's own tests after it.
    # tests/test_edition.py (StandardRunGuard, EditionLaneTests) holds each lane to the edition
    # it names and this list to the editions there are.
    #
    # And each lane in parts, one job each (2026-09-28). A lane took 78 to 103 minutes as one job;
    # scripts/test_parts.py deals its test files into PARTS parts balanced by their measured
    # durations, and the parts together are exactly the suite one job ran - tests/test_split_runs.py
    # proves that for every count used here, and a whole run and a parallel one were compared test
    # by test before this was switched on. What a lane checks once - the compile and the smoke test -
    # runs in its first part only, so it still runs exactly once per lane.
    #
    # Four parts, from measurement (2026-09-29). The eight lanes' test steps took 65 to 125 minutes
    # in the last five runs, and a public repository gets about 20 jobs at once. Laid onto 20 slots,
    # those times give: 2 parts, 51 minutes to the last green (67 on the slowest runs seen); 3 parts,
    # 61 - 24 jobs, and the last 4 wait for a whole part; 4 parts, 48 (57); 5 parts, 43 alone but 64
    # once a release's or the ko sync's four jobs hold slots too. And tests/test_gui_layout.py, one
    # file of one probe, is a floor of about 20 minutes on a runner that no count goes below.
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
        experimental: [false]
        edition: [standard, advanced]
        # PARTS below is the length of this list; tests/test_split_runs.py holds the two together,
        # so no part of a lane can be dropped by changing one of them.
        part: [1, 2, 3, 4]
        include:
          # The next Python, while it is still a release candidate. It is not decoration:
          # it compiles the sources and runs the same suite, and a failure is annotated
          # exactly like any other, so a real incompatibility is visible the day it
          # appears. It does not block, because a defect in a pre-release interpreter is
          # not a defect in this product - and finding out about a real one in October,
          # from a user, is worse than finding out now from a lane nobody had to merge.
          #
          # Once per edition and part, like every other Python. An entry that sets a new Python
          # makes one job of its own rather than joining the ones above, so each is named.
          - {python-version: "3.15", experimental: true, edition: standard, part: 1}
          - {python-version: "3.15", experimental: true, edition: standard, part: 2}
          - {python-version: "3.15", experimental: true, edition: standard, part: 3}
          - {python-version: "3.15", experimental: true, edition: standard, part: 4}
          - {python-version: "3.15", experimental: true, edition: advanced, part: 1}
          - {python-version: "3.15", experimental: true, edition: advanced, part: 2}
          - {python-version: "3.15", experimental: true, edition: advanced, part: 3}
          - {python-version: "3.15", experimental: true, edition: advanced, part: 4}
    # Only the pre-release lane is allowed to fail the job without failing the run.
    continue-on-error: ${{ matrix.experimental }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Pull requests run their own code here. The read-only token is still not
          # left on disk for it.
          persist-credentials: false
          # The upgrade and downgrade tests build their databases with the store code
          # of real tagged releases, so the tags and their commits must be here.
          fetch-depth: 0

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          # Needed for the future lane, and harmless for the others: a stable release
          # is still preferred where one exists, so this does not quietly move a
          # blocking version onto a release candidate. It also means the day the next
          # Python ships, that lane starts testing the real thing without an edit.
          allow-prereleases: true

      - name: Say which interpreter this actually is
        # The lane is named for a line, not a build. When a failure turns out to be the
        # interpreter's, the first question is which one - and on the pre-release lane
        # that answer changes under you.
        run: python -c "import sys; print(sys.version)"

      - name: Compile all sources
        # advanced/ in every lane: it is source this repository ships, and a file that does not
        # compile on a Python is worth knowing about whichever edition the lane tests. Once per
        # lane, in its first part.
        if: matrix.part == 1
        run: python -m compileall -q src tests scripts advanced

      - name: Run the automated test suite
        # These tests use fakes and temp dirs. They never contact the ChatGPT app
        # and never send a message to any Codex conversation.
        # CODEX_AR_LIVE is deliberately unset, so the live checks stay skipped.
        #
        # This job's part of its lane. A failure is repeated as a workflow error annotation
        # (--annotate), not just written to the log. Reading a run's log needs repository admin
        # rights; annotations are part of the run's public status, so "which test failed" is
        # answerable by anyone looking at the failure - including from a machine that cannot
        # reproduce it.
        #
        # The lane says which edition it tests in CODEX_AR_EDITION, and StandardRunGuard holds
        # it to that. scripts/test_parts.py's LANES says what each lane runs: the standard lane
        # imports core alone. The advanced lane puts the repository's advanced/src on the path
        # too, so the package is importable - from there and nowhere else - and then runs the
        # package's own tests. Core takes the package only from beside itself
        # (src/codex_auto_resume/edition.py), so the core suite there is the standard edition with
        # an advanced checkout on its path, which must change nothing; the package beside a copy of
        # core is the loader's cases, run in both lanes. Every suite in the part runs, and the part
        # fails after the last if any of them failed.
        #
        # --seconds writes what each of the part's files took, as the runner measured it, for the
        # next step to keep.
        shell: pwsh
        env:
          CODEX_AR_EDITION: ${{ matrix.edition }}
          # The advanced lane runs the one live WMI test (advanced/tests/test_advanced_measure.py,
          # WmiEscapeTests): throwaway pythonw processes in a job of the test's own and a temporary
          # directory, killed when it ends. No Codex, no install, no registry. The standard lane
          # leaves it empty, which the test reads as not asked for.
          CODEX_AR_LIVE_WMI: ${{ matrix.edition == 'advanced' && '1' || '' }}
          PART: ${{ matrix.part }}
          PARTS: "4"
        run: python scripts/test_parts.py --lane $env:CODEX_AR_EDITION --part "$env:PART/$env:PARTS" -v --annotate --seconds "$env:RUNNER_TEMP\seconds.json"

      - name: Keep this part's seconds per file
        # tests/data/durations.json is what the parts are dealt by, and it is refreshed from these
        # without a person: after every green run on dev, durations.yml reads them and commits a new
        # table to dev when it shortens some lane's longest part by enough (scripts/test_parts.py
        # --refresh-seconds). By hand: `gh run download <run> -p 'seconds-*'`, then --merge-seconds. Read
        # from the job log instead, a file's seconds were its lines' timestamps, and a test with a
        # docstring was credited to the file after it. A failed part timed its files too, so this
        # runs whatever the suite did; a re-run's seconds replace the first attempt's.
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: seconds-${{ matrix.edition }}-${{ matrix.python-version }}-${{ matrix.part }}
          path: ${{ runner.temp }}/seconds.json
          retention-days: 30
          overwrite: true
          if-no-files-found: warn

      - name: CLI smoke test in an isolated home
        # Once per lane, in its first part.
        if: matrix.part == 1
        env:
          PYTHONPATH: src
        run: |
          python src\auto_resume.py --home "${{ runner.temp }}\ar-home" --quiet install
          python src\auto_resume.py --home "${{ runner.temp }}\ar-home" --quiet status
          python src\auto_resume.py --home "${{ runner.temp }}\ar-home" --quiet install
          python src\auto_resume.py --home "${{ runner.temp }}\ar-home" --quiet uninstall
          python src\auto_resume.py --home "${{ runner.temp }}\ar-home" --quiet uninstall

  main-tree:
    # The release lane on the tree main will hold: dev's, with every Korean source taken off.
    #
    # dev carries each document in English and Korean; a promotion to main deletes every *.ko.md
    # (scripts/promote.py), and the release builds from main. So a test that reads a Korean source
    # without asking whether this checkout holds one (tests/languages.py) passes every lane here and
    # fails on main and in the release - which is how docs/GUIDE.ko.md got there on 2026-10-02. This
    # job finds it before the promotion does. One lane, in the release's parts on the release's
    # Python, and not on main or a pull request into it, whose tree already is main's.
    if: github.ref != 'refs/heads/main' && github.base_ref != 'main'
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        # PARTS below is the length of this list; tests/test_split_runs.py holds the two together.
        part: [1, 2, 3, 4]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Checked out as the test job checks out, for the same reasons.
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Take every Korean source off, as a promotion to main does
        # Removed from the index too: the suite lists files with `git ls-files`, and main's index has
        # none of them. The pathspec matches at every depth, README.ko.md included.
        shell: bash
        run: |
          git rm -q --ignore-unmatch -- '*.ko.md'
          test -z "$(git ls-files -- '*.ko.md')"

      - name: Run the release lane on main's tree, this part
        # CODEX_AR_TREE tells tests/languages.py this tree is main's, so the branch check holds it to
        # main's rule - no Korean at all - on a push to dev and on a pull request into it.
        shell: pwsh
        env:
          CODEX_AR_TREE: main
          PART: ${{ matrix.part }}
          PARTS: "4"
        run: python scripts/test_parts.py --lane release --part "$env:PART/$env:PARTS" -v --annotate --seconds "$env:RUNNER_TEMP\seconds.json"

      - name: Keep this part's seconds per file
        # The release lane's table is this job's (the test job's step above says why and how).
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: seconds-release-main-tree-${{ matrix.part }}
          path: ${{ runner.temp }}/seconds.json
          retention-days: 30
          overwrite: true
          if-no-files-found: warn
